# Render Blueprint — API Web Service only.
# Cron scraping is handled by GitHub Actions (free tier).
# Docs: https://render.com/docs/blueprint-spec

services:
  # --- Backend API (Free Web Service) ---
  - type: web
    name: apix-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: API_KEYS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
