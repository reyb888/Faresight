name: Daily Airfare Scrape & Index Pipeline

on:
  schedule:
    # Run daily at 20:00 UTC (01:30 AM IST)
    - cron: '0 20 * * *'
  # Allow manual trigger on-demand from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape_and_index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Daily Scrape, Clean & Index Batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          SCRAPE_USER_AGENT: "APIx-ResearchBot/1.0 (+https://github.com/${{ github.repository }})"
        run: |
          bash scripts/run_daily_batch.sh
